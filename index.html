            --border-color: #24335c;
            --text-bright: #38bdf8; 
        }

            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* Header / Tech Branding */
        header {
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            min-width: 38em;
            flex-shrink: 0;
        }

        /* Pill-shaped Page Switcher */
        .pill-toggle {
            display: inline-flex;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 3px;
            gap: 2px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pill-btn:hover {
            color: var(--text-primary);
        }

        .pill-btn.active {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-main);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .timestamp {
            font-family: monospace;
            color: var(--accent-cyan);
            font-size: 0.9rem;
            background: rgba(0, 242, 254, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* KPI Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-blue));
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-bright);
            font-family: monospace;
            white-space: nowrap;
        }

        .card-subtext {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Data Section Controls */
        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            color: var(--text-bright);
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* Data Table Wrapper */
        .table-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            width: 25%;
            padding: 0.85rem 1rem;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            background-color: rgba(22, 31, 56, 0.9);
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:not(:last-child), td:not(:last-child) {
            border-right: 1px solid rgba(36, 51, 92, 0.35);
        }

        td {
            border-bottom: 1px solid rgba(36, 51, 92, 0.4);
            font-size: 0.95rem;
        }

        tr:nth-child(even) {
            background-color: var(--bg-row-even);
        }

        .year-val {
            font-weight: 600;
            color: var(--text-primary);
        }

        .mintage-val {
            font-family: monospace;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-bright);
        }

            color: var(--text-primary);
        }

            font-weight: 600;
            color: var(--text-primary);

        }

            background: var(--bg-main);
        }

            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

</head>

        if (year >= 1857 && year <= 1864) return "88% Cu, 12% Ni";
        if (year >= 1864 && year <= 1942) return "95% Cu, 5% Sn/Zn";
        if (year >= 1944 && year <= 1982) return "95% Cu, 5% Zn";

        return "Standard Alloy";

    let currentPage = 'pennies';
    let rawDataset = datasets[currentPage].data;

    const tbody = document.getElementById('data-rows');
    const searchInput = document.getElementById('search-input');
    const pageTitle = document.getElementById('page-title');
    const timestampBadge = document.getElementById('timestamp-badge');

    // Switch between pages via pill buttons
    function switchPage(pageKey) {
        currentPage = pageKey;
        rawDataset = datasets[pageKey].data;

        // Update active class on pills
        document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        // Update title and range badge
        pageTitle.innerText = datasets[pageKey].title;
        timestampBadge.innerText = datasets[pageKey].range;

        // Clear search and refresh view
        searchInput.value = '';
        calculateStats();
        displayTable();
    }

    // Function to calculate and render the dynamic top KPI cards
    function calculateStats() {
        let total = 0;
        let count = 0;
        let maxMintage = -Infinity;
        let maxYear = "";
        let minMintage = Infinity;
        let minYear = "";

        rawDataset.forEach(entry => {
            if (entry.mintage !== null && entry.mintage !== undefined) {
                total += entry.mintage;
                count++;

                if (entry.mintage > maxMintage) {
                    maxMintage = entry.mintage;
                    maxYear = entry.year;
                }
                if (entry.mintage < minMintage) {
                    minMintage = entry.mintage;
                    minYear = entry.year;
                }
            }
        });

        const avgMintage = count > 0 ? Math.round(total / count) : 0;

        document.getElementById('stat-max').innerText = maxMintage !== -Infinity ? maxMintage.toLocaleString() : '-';
        document.getElementById('stat-max-year').innerText = `Year: ${maxYear || '-'}`;
        
        document.getElementById('stat-min').innerText = minMintage !== Infinity ? minMintage.toLocaleString() : '-';
        document.getElementById('stat-min-year').innerText = `Year: ${minYear || '-'}`;
        
        document.getElementById('stat-total').innerText = total > 0 ? total.toLocaleString() : '-';
        document.getElementById('stat-avg').innerText = avgMintage > 0 ? avgMintage.toLocaleString() : '-';
    }

    // Helper function to build a searchable composition string including full element names
    function getSearchableComposition(composition) {
        let searchable = composition;
        searchable += " " + searchable
            .replace(/\bCu\b/g, "copper")
            .replace(/\bZn\b/g, "zinc")
            .replace(/\bNi\b/g, "nickel")
            .replace(/\bSn\b/g, "tin")
            .replace(/\bStl\b/g, "steel")
            .replace(/\bAg\b/g, "silver")
            .replace(/\bMn\b/g, "manganese");
        return searchable.toLowerCase();
    }

    // Function to render rows onto the datatable layout
    function displayTable(filterText = '') {
        tbody.innerHTML = '';
        const search = filterText.toLowerCase().trim();

        rawDataset.forEach(entry => {
            const yearMatch = entry.year.toLowerCase().includes(search);
            const designMatch = entry.design.toLowerCase().includes(search);
            const searchableComp = getSearchableComposition(entry.composition);
            const compositionMatch = searchableComp.includes(search);

            if (search !== '' && !yearMatch && !designMatch && !compositionMatch) {
                return;
            }

            const tr = document.createElement('tr');
            const displayMintage = entry.mintage !== null ? entry.mintage.toLocaleString() : "N/A";

            tr.innerHTML = `
                <td><div class="year-val">${entry.year}</div></td>
                <td><div class="mintage-val">${displayMintage}</div></td>
                <td><div class="design-val">${entry.design}</div></td>
                <td><div class="composition-val">${entry.composition}</div></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Setup input listener for dynamic filtering
    searchInput.addEventListener('input', (e) => {
        displayTable(e.target.value);
    });

    // Initialize application runtime
    calculateStats();
    displayTable();
</script>
