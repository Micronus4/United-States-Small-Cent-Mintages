            --accent-blue: #0072ff;

            --border-color: #24335c;
            --text-bright: #38bdf8; 
        }

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* Header / Tech Branding */
        header {
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            min-width: 38em;
            flex-shrink: 0;
        }

        /* Pill-shaped Page Switcher */
        .pill-toggle {
            display: inline-flex;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 3px;
            gap: 2px;
            flex-shrink: 0;
        }

        .pill-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pill-btn:hover {
            color: var(--text-primary);
        }

        .pill-btn.active {
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-main);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .timestamp {
            font-family: monospace;
            color: var(--accent-cyan);
            font-size: 0.9rem;
            background: rgba(0, 242, 254, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* KPI Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-blue));
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .card-value {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-bright);
            font-family: monospace;
            white-space: nowrap;
        }

        .card-subtext {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Data Section Controls */
        .table-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            color: var(--text-bright);
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* Data Table Wrapper */
        .table-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            /* Scroll wheel removed: max-height and overflow-y deleted */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            width: 25%;
            padding: 0.85rem 1rem;
            text-align: center;
            vertical-align: middle;
            white-space: nowrap;
        }

        th {
            background-color: rgba(22, 31, 56, 0.95);
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:not(:last-child), td:not(:last-child) {
            border-right: 1px solid rgba(36, 51, 92, 0.35);
        }

        td {
            border-bottom: 1px solid rgba(36, 51, 92, 0.4);
            font-size: 0.95rem;
        }

        tr:nth-child(even) {
            background-color: var(--bg-row-even);
        }

        .year-val {
            font-weight: 600;
            color: var(--text-primary);
        }

        .mintage-val {
            font-family: monospace;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-bright);

            color: var(--text-primary);
        }

            font-weight: 600;
            color: var(--text-primary);

            width: 8px;
        }

            background: var(--bg-main);
        }

            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

</head>

        if (year >= 1857 && year <= 1864) return "88% Cu, 12% Ni";
        if (year >= 1864 && year <= 1942) return "95% Cu, 5% Sn/Zn";
        if (year >= 1944 && year <= 1982) return "95% Cu, 5% Zn";

        return "Standard Alloy";

    let currentPage = 'pennies';
    let rawDataset = datasets[currentPage].data;

    const pageTitle = document.getElementById('page-title');
    const timestampBadge = document.getElementById('timestamp-badge');
    const searchInput = document.getElementById('search-input');
    const tbody = document.getElementById('data-rows');
    const pillButtons = document.querySelectorAll('.pill-btn');

    // KPI Elements
    const statMax = document.getElementById('stat-max');
    const statMaxYear = document.getElementById('stat-max-year');
    const statMin = document.getElementById('stat-min');
    const statMinYear = document.getElementById('stat-min-year');
    const statTotal = document.getElementById('stat-total');
    const statAvg = document.getElementById('stat-avg');

    // Function to switch between Pennies and Nickels
    function switchPage(pageKey) {
        currentPage = pageKey;
        rawDataset = datasets[currentPage].data;

        pageTitle.innerText = datasets[currentPage].title;
        timestampBadge.innerText = datasets[currentPage].range;

        pillButtons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        searchInput.value = '';
        calculateStats();
        displayTable();
    }

    // Smart search normalization for compositions
    function getSearchableComposition(compStr) {
        let clean = compStr.toLowerCase();
        clean = clean.replace(/%/g, ' percent');
        clean = clean.replace(/cu/g, 'copper');
        clean = clean.replace(/ni/g, 'nickel');
        clean = clean.replace(/zn/g, 'zinc');
        clean = clean.replace(/sn/g, 'tin');
        clean = clean.replace(/stl/g, 'steel');
        clean = clean.replace(/mn/g, 'manganese');
        clean = clean.replace(/ag/g, 'silver');
        return clean;
    }

    // Function to calculate and render dashboard metrics based on current raw dataset
    function calculateStats() {
        let maxVal = -1;
        let maxYearStr = '-';
        let minVal = Infinity;
        let minYearStr = '-';
        let totalVal = 0;
        let validCount = 0;

        rawDataset.forEach(entry => {
            if (entry.mintage !== null) {
                totalVal += entry.mintage;
                validCount++;
                if (entry.mintage > maxVal) {
                    maxVal = entry.mintage;
                    maxYearStr = entry.year;
                }
                if (entry.mintage < minVal) {
                    minVal = entry.mintage;
                    minYearStr = entry.year;
                }
            }
        });

        const avgVal = validCount > 0 ? Math.round(totalVal / validCount) : 0;

        statMax.innerText = maxVal !== -1 ? maxVal.toLocaleString() : 'N/A';
        statMaxYear.innerText = `Year: ${maxYearStr}`;

        statMin.innerText = minVal !== Infinity ? minVal.toLocaleString() : 'N/A';
        statMinYear.innerText = `Year: ${minYearStr}`;

        statTotal.innerText = totalVal.toLocaleString();
        statAvg.innerText = avgVal.toLocaleString();
    }

    // Function to render rows onto the datatable layout
    function displayTable(filterText = '') {
        tbody.innerHTML = '';
        const search = filterText.toLowerCase().trim();

        rawDataset.forEach(entry => {
            const yearMatch = entry.year.toLowerCase().includes(search);
            const designMatch = entry.design.toLowerCase().includes(search);
            const searchableComp = getSearchableComposition(entry.composition);
            const compositionMatch = searchableComp.includes(search);

            if (search !== '' && !yearMatch && !designMatch && !compositionMatch) {
                return;
            }

            const tr = document.createElement('tr');
            const displayMintage = entry.mintage !== null ? entry.mintage.toLocaleString() : "N/A";

            tr.innerHTML = `
                <td><div class="year-val">${entry.year}</div></td>
                <td><div class="mintage-val">${displayMintage}</div></td>
                <td><div class="design-val">${entry.design}</div></td>
                <td><div class="composition-val">${entry.composition}</div></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Setup input listener for dynamic filtering
    searchInput.addEventListener('input', (e) => {
        displayTable(e.target.value);
    });

    // Initialize application runtime
    calculateStats();
    displayTable();
</script>
